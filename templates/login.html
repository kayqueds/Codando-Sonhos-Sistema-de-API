{% extends "base.html" %}

{% block title %}Login - Sistema de Usuários{% endblock %}

{% block content %}
<div class="header">
    <h1 class="text-2xl font-bold">Fazer Login</h1>
</div>

<div class="card">
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Entrar</button>
    </form>
    <div id="message" class="mt-4"></div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();

        const messageDiv = document.getElementById('message');
        if (response.ok) {
            localStorage.setItem('token', result.access_token);
            window.location.href = '/dashboard';
        } else {
            messageDiv.innerHTML = '<div class="alert alert-error">' + result.message + '</div>';
        }
    } catch (error) {
        document.getElementById('message').innerHTML = '<div class="alert alert-error">Erro ao fazer login.</div>';
    }
});
</script>
{% endblock %}
